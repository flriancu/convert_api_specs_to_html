$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  Note:
    type: object
    required: [id, text]
    additionalProperties: false
    properties:
      id:
        type: string
        description: Assigned by the service.
      text:
        type: string
        minLength: 1
        description: The note's text.
  Error:
    type: object
    required: [code, message]
    additionalProperties: false
    properties:
      code:
        type: string
        description: Machine-readable, e.g. INVALID.
      message:
        type: string
        description: For people.
