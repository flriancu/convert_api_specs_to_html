openapi: 3.1.0
info:
  title: Notes API
  version: 1.0.0
  description: A small example that the tests render. Notes are created and listed over HTTP.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
security:
  - token: []
tags:
  - name: notes
    description: Create and list notes.
paths:
  /notes:
    get:
      tags: [notes]
      operationId: listNotes
      summary: List the notes
      parameters:
        - name: limit
          in: query
          description: At most this many notes, newest first.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: The newest notes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: './schemas.yaml#/$defs/Note' }
        '400':
          $ref: '#/components/responses/Invalid'
    post:
      tags: [notes]
      operationId: createNote
      summary: Create a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string, minLength: 1 }
      responses:
        '201':
          description: The note as created.
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/$defs/Note' }
        '400':
          $ref: '#/components/responses/Invalid'
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
  responses:
    Invalid:
      description: The request is malformed or a value is out of range.
      content:
        application/json:
          schema: { $ref: './schemas.yaml#/$defs/Error' }
